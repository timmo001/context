min_version = "2025.1.0"

[tools]
node = "26.13.1"
bun = "1.4.5"
# The linters the shared hk pre-push hook runs, matching CI.
uv = "0.13.9"
# yamllint's PyYAML has no wheels for newer Pythons, and mise won't build it from source.
python = "3.15.2"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install context dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Run context in watch mode"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Compile the context binary"
depends = ["install"]
run = "bun run build"

[tasks."build:packages"]
description = "Build the @timmo001/effect-context package"
depends = ["install"]
run = "bun run build:packages"

[tasks.typecheck]
description = "Type-check the context source"
depends = ["install"]
run = [
  "bun ./node_modules/typescript/bin/tsc --noEmit",
  # The OpenCode plugin pins OpenCode's Effect, so it has its own install.
  "bun install --cwd opencode-plugin --frozen-lockfile",
  "bun ./node_modules/typescript/bin/tsc -p opencode-plugin",
]

[tasks.test]
description = "Run context tests"
depends = ["install"]
run = "bun test"

[tasks.lint]
description = "Lint source with Oxlint"
# Type-aware linting reads docs/tsconfig.json, which extends astro's tsconfig from the docs dependencies.
depends = ["install", "docs:install"]
run = "bun run lint"

[tasks.format]
description = "Format source and docs"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
# The aggregate check also regenerates the reference pages Prettier reads.
wait_for = ["docs:gen"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check, verify formatting, build the library package and check the docs site"
depends = ["lint", "typecheck", "format:check", "build:packages", "docs:check"]

[tasks."docs:install"]
description = "Install docs dependencies"
dir = "docs"
run = "bun install --frozen-lockfile"

[tasks."docs:dev"]
description = "Run docs dev server"
depends = ["docs:install"]
dir = "docs"
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
depends = ["docs:gen", "docs:install"]
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks."docs:build"]
description = "Build docs site"
depends = ["docs:install"]
dir = "docs"
run = "bun run build"

[tasks."docs:plan"]
description = "Build the docs site, then show what deploying its prod stage would change"
depends = ["docs:build"]
dir = "docs"
run = "bun run plan"

[tasks."docs:deploy"]
description = "Build the docs site, then deploy its prod stage with Alchemy"
depends = ["docs:build"]
dir = "docs"
run = "bun run deploy"

[tasks."docs:deploy:github"]
description = "Mint CI's Cloudflare token into the repository's secrets"
depends = ["docs:install"]
dir = "docs"
run = "bun run deploy:github"

[tasks."docs:brand"]
description = "Regenerate the docs logo PNGs and social preview"
depends = ["docs:install"]
dir = "docs"
run = "bun run brand"

[tasks."docs:preview"]
description = "Preview docs site"
depends = ["docs:install"]
dir = "docs"
run = "bun run preview"

[tasks."docs:gen:cli"]
description = "Regenerate CLI command reference"
depends = ["install"]
dir = "docs"
run = "bun run gen:cli"

[tasks."docs:gen:mcp"]
description = "Regenerate MCP tool reference"
depends = ["install"]
dir = "docs"
run = "bun run gen:mcp"

[tasks."docs:gen"]
description = "Regenerate generated docs"
depends = ["install"]
dir = "docs"
run = "bun run gen"

[tasks."docs:check"]
description = "Regenerate the references, then check the docs site's pages, links and types without disturbing a running dev server"
depends = ["docs:gen", "docs:install"]
dir = "docs"
# The tsconfig reads Blume's generated types from .blume/. When it exists a dev
# server may be using it, so check in --isolated's .blume-verify/ and keep
# reading those types; in a fresh checkout such as CI, generate .blume/ itself.
run = "if [ -d .blume ]; then bun run check -- --isolated; else bun run check; fi"
