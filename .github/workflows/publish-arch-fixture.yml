    name: Build context-git fixture
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@ac41091b4ba1e9df4461adc354538e0a96d7f099 # master
    with:
      package-name: context-git
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
