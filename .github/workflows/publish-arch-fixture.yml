    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@48c0a150910c542449e99830d9543a026813be13 # master
    with:
      package-name: context-git
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
