# yamllint disable-line rule:truthy
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: Build context-git fixture
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@b41043b282a997123912e4c61b793b4da774b8e8 # master
    with:
      package-name: context-git
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
