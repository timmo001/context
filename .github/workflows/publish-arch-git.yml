---
name: Publish Arch git package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - bun.lock
      - mise.toml
      - LICENSE
      - .scripts/linux/PKGBUILD
      - .github/workflows/publish-arch-git.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-arch-git-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Arch package (context-git)
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@43e7be6974bb98454ffa56fc5a4b46cc160e09bc # master
    with:
      package-name: context-git
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
