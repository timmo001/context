---
name: Package stable release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-version:
        description: Stable GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    release-linux-${{
      inputs.release-version || github.event.release.tag_name
    }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate stable release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
    steps:
      - name: Validate published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_VERSION" =~ ^[0-9]{8}\.[0-9]+$ ]] || {
            echo "::error::Invalid stable release version: $RELEASE_VERSION"
            exit 1
          }
          release="$(gh release view "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          [[ "$(jq -r '.isDraft' <<< "$release")" == "false" ]] || {
            echo "::error::Release $RELEASE_VERSION is still a draft."
            exit 1
          }
          [[ "$(jq -r '.isPrerelease' <<< "$release")" == "false" ]] || {
            echo "::error::Release $RELEASE_VERSION is a prerelease."
            exit 1
          }

  release:
    name: Build and publish Linux packages
    needs: validate-release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.release.prerelease
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/release-bun-cli-linux.yml@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0
    with:
      binary-name: context
      package-name: context
      entrypoint: src/index.ts
      package-config: .scripts/linux/nfpm.yaml
      smoke-test-arguments: |-
        help
        stack --json
      package-prepare-command: |-
        mkdir -p .scripts/linux/completions
        ./dist/release/root/context completions bash > .scripts/linux/completions/context.bash
        ./dist/release/root/context completions fish > .scripts/linux/completions/context.fish
        ./dist/release/root/context completions zsh > .scripts/linux/completions/_context
      release-version: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      source-ref: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      existing-release: true
      attest: true

  prepare-arch-bin:
    name: Prepare Arch package (context-bin)
    needs: release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_VERSION }}

      - name: Render PKGBUILD
        uses: timmo001/workflows/.github/actions/prepare-arch-bin@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0
        with:
          releaseVersion: ${{ env.RELEASE_VERSION }}
          packageName: context
          pkgbuildTemplate: .scripts/linux/PKGBUILD.bin
          outputDirectory: ${{ runner.temp }}/arch-bin
          completionsArguments: "completions {shell}"
          extraFiles: LICENSE

      - name: Upload package files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arch-context-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-bin
          if-no-files-found: error
          retention-days: 1

  arch-bin:
    name: Arch package (context-bin)
    needs: prepare-arch-bin
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0
    with:
      package-name: context-bin
      package-files-artifact-name: arch-context-bin-${{ github.run_id }}-${{ github.run_attempt }}
      pkgbuild-path: PKGBUILD
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}

  attach-arch-bin:
    name: Attach Arch package (context-bin)
    needs: arch-bin
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/attach-release-arch-package.yml@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0
    with:
      artifact-name: ${{ needs.arch-bin.outputs.artifact-name }}
      release-tag: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      package-name: context-bin

  publish-aur:
    name: Publish AUR (context-bin)
    needs: prepare-arch-bin
    uses: timmo001/workflows/.github/workflows/publish-aur.yml@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0
    with:
      package-name: context-bin
      artifact-name: arch-context-bin-${{ github.run_id }}-${{ github.run_attempt }}
      auxiliary-file-paths: |-
        context.bash
        context.fish
        _context
        LICENSE
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
