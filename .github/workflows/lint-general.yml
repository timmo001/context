---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@70421d48dd34dc6356326bc6a35386a0a3301561 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@70421d48dd34dc6356326bc6a35386a0a3301561 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@70421d48dd34dc6356326bc6a35386a0a3301561 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@70421d48dd34dc6356326bc6a35386a0a3301561 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@70421d48dd34dc6356326bc6a35386a0a3301561 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@70421d48dd34dc6356326bc6a35386a0a3301561 # master
    with:
      scandir: ./.scripts
      severity: warning
