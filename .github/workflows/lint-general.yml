---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0
    with:
      scandir: ./.scripts
      severity: warning
