---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@fe592e0a559dc882914a1f21c8af7fee5362cb11 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@fe592e0a559dc882914a1f21c8af7fee5362cb11 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@fe592e0a559dc882914a1f21c8af7fee5362cb11 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@fe592e0a559dc882914a1f21c8af7fee5362cb11 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@fe592e0a559dc882914a1f21c8af7fee5362cb11 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@fe592e0a559dc882914a1f21c8af7fee5362cb11 # master
    with:
      scandir: ./.scripts
      severity: warning
