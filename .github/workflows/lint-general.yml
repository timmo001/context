---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1
    with:
      scandir: ./.scripts
      severity: warning
