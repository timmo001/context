---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@490c64c3f555afa983a7553d22e95a53a46fafbb # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@490c64c3f555afa983a7553d22e95a53a46fafbb # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@490c64c3f555afa983a7553d22e95a53a46fafbb # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@490c64c3f555afa983a7553d22e95a53a46fafbb # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@490c64c3f555afa983a7553d22e95a53a46fafbb # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@490c64c3f555afa983a7553d22e95a53a46fafbb # master
    with:
      scandir: ./.scripts
      severity: warning
