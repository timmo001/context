---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@209ae577fdf6efff60113819532d7c714991a0e0 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@209ae577fdf6efff60113819532d7c714991a0e0 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@209ae577fdf6efff60113819532d7c714991a0e0 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@209ae577fdf6efff60113819532d7c714991a0e0 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@209ae577fdf6efff60113819532d7c714991a0e0 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@209ae577fdf6efff60113819532d7c714991a0e0 # master
    with:
      scandir: ./.scripts
      severity: warning
