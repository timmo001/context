---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@a7b34d53ef8f83b1763fd0d3257a0168416e23ab # 20261001.2

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@a7b34d53ef8f83b1763fd0d3257a0168416e23ab # 20261001.2

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@a7b34d53ef8f83b1763fd0d3257a0168416e23ab # 20261001.2

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@a7b34d53ef8f83b1763fd0d3257a0168416e23ab # 20261001.2

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@a7b34d53ef8f83b1763fd0d3257a0168416e23ab # 20261001.2

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@a7b34d53ef8f83b1763fd0d3257a0168416e23ab # 20261001.2

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@a7b34d53ef8f83b1763fd0d3257a0168416e23ab # 20261001.2
    with:
      scandir: ./.scripts
