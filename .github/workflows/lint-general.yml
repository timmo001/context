---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@ca650265a0a7993bd9eb0a02d58672a3ead2da90 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@ca650265a0a7993bd9eb0a02d58672a3ead2da90 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@ca650265a0a7993bd9eb0a02d58672a3ead2da90 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@ca650265a0a7993bd9eb0a02d58672a3ead2da90 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@ca650265a0a7993bd9eb0a02d58672a3ead2da90 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@ca650265a0a7993bd9eb0a02d58672a3ead2da90 # master
    with:
      scandir: ./.scripts
      severity: warning
