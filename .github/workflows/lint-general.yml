---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@721f4b1e2ed4957afb95ac49968d361e18554497 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@721f4b1e2ed4957afb95ac49968d361e18554497 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@721f4b1e2ed4957afb95ac49968d361e18554497 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@721f4b1e2ed4957afb95ac49968d361e18554497 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@721f4b1e2ed4957afb95ac49968d361e18554497 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@721f4b1e2ed4957afb95ac49968d361e18554497 # master
    with:
      scandir: ./.scripts
      severity: warning
