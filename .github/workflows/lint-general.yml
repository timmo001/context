---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@663b296010c7883977baf97e6486a3417a012859 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@663b296010c7883977baf97e6486a3417a012859 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@663b296010c7883977baf97e6486a3417a012859 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@663b296010c7883977baf97e6486a3417a012859 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@663b296010c7883977baf97e6486a3417a012859 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@663b296010c7883977baf97e6486a3417a012859 # master
    with:
      scandir: ./.scripts
      severity: warning
