---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@722ef29d1740604bd16be91fde520339d2cfadbb # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@722ef29d1740604bd16be91fde520339d2cfadbb # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@722ef29d1740604bd16be91fde520339d2cfadbb # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@722ef29d1740604bd16be91fde520339d2cfadbb # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@722ef29d1740604bd16be91fde520339d2cfadbb # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@722ef29d1740604bd16be91fde520339d2cfadbb # master
    with:
      scandir: ./.scripts
      severity: warning
