---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@065e689c85cec1e7d025f6d074b2589e41d6bb2b # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@065e689c85cec1e7d025f6d074b2589e41d6bb2b # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@065e689c85cec1e7d025f6d074b2589e41d6bb2b # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@065e689c85cec1e7d025f6d074b2589e41d6bb2b # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@065e689c85cec1e7d025f6d074b2589e41d6bb2b # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@065e689c85cec1e7d025f6d074b2589e41d6bb2b # master
    with:
      scandir: ./.scripts
      severity: warning
