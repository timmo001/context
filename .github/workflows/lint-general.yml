---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@72d13b406a4306266f3fc938c722ac53fa7b44d2 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@72d13b406a4306266f3fc938c722ac53fa7b44d2 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@72d13b406a4306266f3fc938c722ac53fa7b44d2 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@72d13b406a4306266f3fc938c722ac53fa7b44d2 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@72d13b406a4306266f3fc938c722ac53fa7b44d2 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@72d13b406a4306266f3fc938c722ac53fa7b44d2 # master
    with:
      scandir: ./.scripts
      severity: warning
