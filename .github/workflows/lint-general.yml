---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@cf597d2d9cb4c0f759496dd276b59aa047dcec2b # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@cf597d2d9cb4c0f759496dd276b59aa047dcec2b # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@cf597d2d9cb4c0f759496dd276b59aa047dcec2b # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@cf597d2d9cb4c0f759496dd276b59aa047dcec2b # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@cf597d2d9cb4c0f759496dd276b59aa047dcec2b # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@cf597d2d9cb4c0f759496dd276b59aa047dcec2b # master
    with:
      scandir: ./.scripts
      severity: warning
