---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@4cdb8cb31ae11db8e53fe0fa39031eb3fd40fbc7 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@4cdb8cb31ae11db8e53fe0fa39031eb3fd40fbc7 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@4cdb8cb31ae11db8e53fe0fa39031eb3fd40fbc7 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@4cdb8cb31ae11db8e53fe0fa39031eb3fd40fbc7 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@4cdb8cb31ae11db8e53fe0fa39031eb3fd40fbc7 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@4cdb8cb31ae11db8e53fe0fa39031eb3fd40fbc7 # master
    with:
      scandir: ./.scripts
      severity: warning
