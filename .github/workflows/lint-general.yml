---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0
    with:
      scandir: ./.scripts
      severity: warning
