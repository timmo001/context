---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0
    with:
      scandir: ./.scripts
      severity: warning
