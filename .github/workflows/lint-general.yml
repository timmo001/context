---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@4a140067c8acd609167bffb17c01e63020d06d41 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@4a140067c8acd609167bffb17c01e63020d06d41 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@4a140067c8acd609167bffb17c01e63020d06d41 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@4a140067c8acd609167bffb17c01e63020d06d41 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@4a140067c8acd609167bffb17c01e63020d06d41 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@4a140067c8acd609167bffb17c01e63020d06d41 # master
    with:
      scandir: ./.scripts
      severity: warning
