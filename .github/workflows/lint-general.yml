---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@3d5608761e2468512c581fbe499737869c4c8f38 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@3d5608761e2468512c581fbe499737869c4c8f38 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@3d5608761e2468512c581fbe499737869c4c8f38 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@3d5608761e2468512c581fbe499737869c4c8f38 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@3d5608761e2468512c581fbe499737869c4c8f38 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@3d5608761e2468512c581fbe499737869c4c8f38 # master
    with:
      scandir: ./.scripts
      severity: warning
