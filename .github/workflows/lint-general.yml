---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@a8adaa5b610b710dd8a8becd7d504c8e2a9b7e8f # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@a8adaa5b610b710dd8a8becd7d504c8e2a9b7e8f # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@a8adaa5b610b710dd8a8becd7d504c8e2a9b7e8f # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@a8adaa5b610b710dd8a8becd7d504c8e2a9b7e8f # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@a8adaa5b610b710dd8a8becd7d504c8e2a9b7e8f # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@a8adaa5b610b710dd8a8becd7d504c8e2a9b7e8f # master
    with:
      scandir: ./.scripts
      severity: warning
