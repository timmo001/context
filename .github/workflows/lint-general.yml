---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@7ca73488f2c4d16f40e6fbc8afad83ffab7b96fd # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@7ca73488f2c4d16f40e6fbc8afad83ffab7b96fd # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@7ca73488f2c4d16f40e6fbc8afad83ffab7b96fd # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@7ca73488f2c4d16f40e6fbc8afad83ffab7b96fd # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@7ca73488f2c4d16f40e6fbc8afad83ffab7b96fd # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@7ca73488f2c4d16f40e6fbc8afad83ffab7b96fd # master
    with:
      scandir: ./.scripts
      severity: warning
