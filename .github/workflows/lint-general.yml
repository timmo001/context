---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@1ed6e00bfeecec20f59b49bb96a40969ccc8821b # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@1ed6e00bfeecec20f59b49bb96a40969ccc8821b # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@1ed6e00bfeecec20f59b49bb96a40969ccc8821b # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@1ed6e00bfeecec20f59b49bb96a40969ccc8821b # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@1ed6e00bfeecec20f59b49bb96a40969ccc8821b # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@1ed6e00bfeecec20f59b49bb96a40969ccc8821b # master
    with:
      scandir: ./.scripts
      severity: warning
