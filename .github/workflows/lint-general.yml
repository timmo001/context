---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@ef14244e5cfe3a9da6441796ee7f39f2f5bde233 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@ef14244e5cfe3a9da6441796ee7f39f2f5bde233 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@ef14244e5cfe3a9da6441796ee7f39f2f5bde233 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@ef14244e5cfe3a9da6441796ee7f39f2f5bde233 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@ef14244e5cfe3a9da6441796ee7f39f2f5bde233 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@ef14244e5cfe3a9da6441796ee7f39f2f5bde233 # master
    with:
      scandir: ./.scripts
      severity: warning
