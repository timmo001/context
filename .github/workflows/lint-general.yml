---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@5e4da65d1ed385c89581f8827599415bc0142f9e # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@5e4da65d1ed385c89581f8827599415bc0142f9e # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@5e4da65d1ed385c89581f8827599415bc0142f9e # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@5e4da65d1ed385c89581f8827599415bc0142f9e # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@5e4da65d1ed385c89581f8827599415bc0142f9e # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@5e4da65d1ed385c89581f8827599415bc0142f9e # master
    with:
      scandir: ./.scripts
      severity: warning
