---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@5c79e16b2e540bd2e708023306bb3987d49c1011 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@5c79e16b2e540bd2e708023306bb3987d49c1011 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@5c79e16b2e540bd2e708023306bb3987d49c1011 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@5c79e16b2e540bd2e708023306bb3987d49c1011 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@5c79e16b2e540bd2e708023306bb3987d49c1011 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@5c79e16b2e540bd2e708023306bb3987d49c1011 # master
    with:
      scandir: ./.scripts
      severity: warning
