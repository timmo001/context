---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@250e9edf712bd8526f6977a113116eda3695f732 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@250e9edf712bd8526f6977a113116eda3695f732 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@250e9edf712bd8526f6977a113116eda3695f732 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@250e9edf712bd8526f6977a113116eda3695f732 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@250e9edf712bd8526f6977a113116eda3695f732 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@250e9edf712bd8526f6977a113116eda3695f732 # master
    with:
      scandir: ./.scripts
      severity: warning
