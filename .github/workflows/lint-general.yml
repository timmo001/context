  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0

