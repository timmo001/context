---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@0ac664d85b0ad75f2d6bec537abece3db3c9f237 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@0ac664d85b0ad75f2d6bec537abece3db3c9f237 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@0ac664d85b0ad75f2d6bec537abece3db3c9f237 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@0ac664d85b0ad75f2d6bec537abece3db3c9f237 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@0ac664d85b0ad75f2d6bec537abece3db3c9f237 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@0ac664d85b0ad75f2d6bec537abece3db3c9f237 # master
    with:
      scandir: ./.scripts
      severity: warning
