---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@22d0a7875aae33b91f092990c4be9addc9584db3 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@22d0a7875aae33b91f092990c4be9addc9584db3 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@22d0a7875aae33b91f092990c4be9addc9584db3 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@22d0a7875aae33b91f092990c4be9addc9584db3 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@22d0a7875aae33b91f092990c4be9addc9584db3 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@22d0a7875aae33b91f092990c4be9addc9584db3 # master
    with:
      scandir: ./.scripts
      severity: warning
