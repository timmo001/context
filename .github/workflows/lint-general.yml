---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@ce3e421edb8e339f5405c70023aca7445270cd13 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@ce3e421edb8e339f5405c70023aca7445270cd13 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@ce3e421edb8e339f5405c70023aca7445270cd13 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@ce3e421edb8e339f5405c70023aca7445270cd13 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@ce3e421edb8e339f5405c70023aca7445270cd13 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@ce3e421edb8e339f5405c70023aca7445270cd13 # master
    with:
      scandir: ./.scripts
      severity: warning
