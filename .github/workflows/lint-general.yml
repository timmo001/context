    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3

