---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@3f210701e71d6548df383f53faec30836b482fa4 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@3f210701e71d6548df383f53faec30836b482fa4 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@3f210701e71d6548df383f53faec30836b482fa4 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@3f210701e71d6548df383f53faec30836b482fa4 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@3f210701e71d6548df383f53faec30836b482fa4 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@3f210701e71d6548df383f53faec30836b482fa4 # master
    with:
      scandir: ./.scripts
      severity: warning
