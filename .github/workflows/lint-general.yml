---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@ff1183decb99b9bd7cea4fe7f1ce6c8f5f10f43b # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@ff1183decb99b9bd7cea4fe7f1ce6c8f5f10f43b # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@ff1183decb99b9bd7cea4fe7f1ce6c8f5f10f43b # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@ff1183decb99b9bd7cea4fe7f1ce6c8f5f10f43b # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@ff1183decb99b9bd7cea4fe7f1ce6c8f5f10f43b # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@ff1183decb99b9bd7cea4fe7f1ce6c8f5f10f43b # master
    with:
      scandir: ./.scripts
      severity: warning
