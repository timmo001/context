---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@d787ea887605af00fd70650e7be38acbdab95aad # 20260929.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@d787ea887605af00fd70650e7be38acbdab95aad # 20260929.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@d787ea887605af00fd70650e7be38acbdab95aad # 20260929.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@d787ea887605af00fd70650e7be38acbdab95aad # 20260929.0

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@d787ea887605af00fd70650e7be38acbdab95aad # 20260929.0

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@d787ea887605af00fd70650e7be38acbdab95aad # 20260929.0
    with:
      scandir: ./.scripts
      severity: warning
