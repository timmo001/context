---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@ac05fe96c617e783e962909de21d4555a3896409 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@ac05fe96c617e783e962909de21d4555a3896409 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@ac05fe96c617e783e962909de21d4555a3896409 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@ac05fe96c617e783e962909de21d4555a3896409 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@ac05fe96c617e783e962909de21d4555a3896409 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@ac05fe96c617e783e962909de21d4555a3896409 # master
    with:
      scandir: ./.scripts
      severity: warning
