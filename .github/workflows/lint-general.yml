---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@b4f6567d034c6d1fc45823b4fce385e211e57993 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@b4f6567d034c6d1fc45823b4fce385e211e57993 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@b4f6567d034c6d1fc45823b4fce385e211e57993 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@b4f6567d034c6d1fc45823b4fce385e211e57993 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@b4f6567d034c6d1fc45823b4fce385e211e57993 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@b4f6567d034c6d1fc45823b4fce385e211e57993 # master
    with:
      scandir: ./.scripts
      severity: warning
