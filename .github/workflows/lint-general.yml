---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@1a824d7aed4312ee47eb5a6eb08d4e3a0e3b1d10 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@1a824d7aed4312ee47eb5a6eb08d4e3a0e3b1d10 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@1a824d7aed4312ee47eb5a6eb08d4e3a0e3b1d10 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@1a824d7aed4312ee47eb5a6eb08d4e3a0e3b1d10 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@1a824d7aed4312ee47eb5a6eb08d4e3a0e3b1d10 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@1a824d7aed4312ee47eb5a6eb08d4e3a0e3b1d10 # master
    with:
      scandir: ./.scripts
      severity: warning
