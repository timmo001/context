---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@bb2645bb83532b44ccc6d9657324eb97715df485 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@bb2645bb83532b44ccc6d9657324eb97715df485 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@bb2645bb83532b44ccc6d9657324eb97715df485 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@bb2645bb83532b44ccc6d9657324eb97715df485 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@bb2645bb83532b44ccc6d9657324eb97715df485 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@bb2645bb83532b44ccc6d9657324eb97715df485 # master
    with:
      scandir: ./.scripts
      severity: warning
