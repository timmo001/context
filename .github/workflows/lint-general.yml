---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@7d9ccf454a6d79e49e868beba33d5b2b4a5ed850 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@7d9ccf454a6d79e49e868beba33d5b2b4a5ed850 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@7d9ccf454a6d79e49e868beba33d5b2b4a5ed850 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@7d9ccf454a6d79e49e868beba33d5b2b4a5ed850 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@7d9ccf454a6d79e49e868beba33d5b2b4a5ed850 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@7d9ccf454a6d79e49e868beba33d5b2b4a5ed850 # master
    with:
      scandir: ./.scripts
      severity: warning
