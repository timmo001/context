---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@98e7b63876e5f278b1937c2b753cd66b924f52b3 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@98e7b63876e5f278b1937c2b753cd66b924f52b3 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@98e7b63876e5f278b1937c2b753cd66b924f52b3 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@98e7b63876e5f278b1937c2b753cd66b924f52b3 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@98e7b63876e5f278b1937c2b753cd66b924f52b3 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@98e7b63876e5f278b1937c2b753cd66b924f52b3 # master
    with:
      scandir: ./.scripts
      severity: warning
