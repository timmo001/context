---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@36527a2230bed48409ccd595b17f8344efe0acdd # 20261001.1

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@36527a2230bed48409ccd595b17f8344efe0acdd # 20261001.1

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@36527a2230bed48409ccd595b17f8344efe0acdd # 20261001.1

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@36527a2230bed48409ccd595b17f8344efe0acdd # 20261001.1

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@36527a2230bed48409ccd595b17f8344efe0acdd # 20261001.1

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@36527a2230bed48409ccd595b17f8344efe0acdd # 20261001.1
    with:
      scandir: ./.scripts
      severity: warning
