---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@da1f8d52a56ce02034b676a8c91275e822934a68 # 20261001.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@da1f8d52a56ce02034b676a8c91275e822934a68 # 20261001.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@da1f8d52a56ce02034b676a8c91275e822934a68 # 20261001.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@da1f8d52a56ce02034b676a8c91275e822934a68 # 20261001.0

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@da1f8d52a56ce02034b676a8c91275e822934a68 # 20261001.0

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@da1f8d52a56ce02034b676a8c91275e822934a68 # 20261001.0
    with:
      scandir: ./.scripts
      severity: warning
