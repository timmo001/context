---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@c4b72ef098fff7fdeaa78dcc2c7c3e6cfa21e621 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@c4b72ef098fff7fdeaa78dcc2c7c3e6cfa21e621 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@c4b72ef098fff7fdeaa78dcc2c7c3e6cfa21e621 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@c4b72ef098fff7fdeaa78dcc2c7c3e6cfa21e621 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@c4b72ef098fff7fdeaa78dcc2c7c3e6cfa21e621 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@c4b72ef098fff7fdeaa78dcc2c7c3e6cfa21e621 # master
    with:
      scandir: ./.scripts
      severity: warning
