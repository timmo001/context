---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@791a98574c1c10eb9cc3ef9f774d7cf62d557675 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@791a98574c1c10eb9cc3ef9f774d7cf62d557675 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@791a98574c1c10eb9cc3ef9f774d7cf62d557675 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@791a98574c1c10eb9cc3ef9f774d7cf62d557675 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@791a98574c1c10eb9cc3ef9f774d7cf62d557675 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@791a98574c1c10eb9cc3ef9f774d7cf62d557675 # master
    with:
      scandir: ./.scripts
      severity: warning
