---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@524680520b97d41da35f7062e18ac6514b88fc7f # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@524680520b97d41da35f7062e18ac6514b88fc7f # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@524680520b97d41da35f7062e18ac6514b88fc7f # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@524680520b97d41da35f7062e18ac6514b88fc7f # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@524680520b97d41da35f7062e18ac6514b88fc7f # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@524680520b97d41da35f7062e18ac6514b88fc7f # master
    with:
      scandir: ./.scripts
      severity: warning
