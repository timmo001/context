---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
    with:
      scandir: ./.scripts
      severity: warning
