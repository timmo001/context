---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@49bbe9c0795b8553b4c6cf5997406747fd42b1b7 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@49bbe9c0795b8553b4c6cf5997406747fd42b1b7 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@49bbe9c0795b8553b4c6cf5997406747fd42b1b7 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@49bbe9c0795b8553b4c6cf5997406747fd42b1b7 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@49bbe9c0795b8553b4c6cf5997406747fd42b1b7 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@49bbe9c0795b8553b4c6cf5997406747fd42b1b7 # master
    with:
      scandir: ./.scripts
      severity: warning
