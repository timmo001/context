---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@b95c90b0674861142678021ab87d808cf6b766b6 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@b95c90b0674861142678021ab87d808cf6b766b6 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@b95c90b0674861142678021ab87d808cf6b766b6 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@b95c90b0674861142678021ab87d808cf6b766b6 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@b95c90b0674861142678021ab87d808cf6b766b6 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@b95c90b0674861142678021ab87d808cf6b766b6 # master
    with:
      scandir: ./.scripts
      severity: warning
