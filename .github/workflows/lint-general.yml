---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@7a5e6e47b7c78fc9d200fc183e9b63b9756f6ace # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@7a5e6e47b7c78fc9d200fc183e9b63b9756f6ace # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@7a5e6e47b7c78fc9d200fc183e9b63b9756f6ace # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@7a5e6e47b7c78fc9d200fc183e9b63b9756f6ace # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@7a5e6e47b7c78fc9d200fc183e9b63b9756f6ace # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@7a5e6e47b7c78fc9d200fc183e9b63b9756f6ace # master
    with:
      scandir: ./.scripts
      severity: warning
