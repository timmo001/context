---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@dcc044376a732ab21a9718e50b0cc17aa5096e0b # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@dcc044376a732ab21a9718e50b0cc17aa5096e0b # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@dcc044376a732ab21a9718e50b0cc17aa5096e0b # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@dcc044376a732ab21a9718e50b0cc17aa5096e0b # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@dcc044376a732ab21a9718e50b0cc17aa5096e0b # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@dcc044376a732ab21a9718e50b0cc17aa5096e0b # master
    with:
      scandir: ./.scripts
      severity: warning
