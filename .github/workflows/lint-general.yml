---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@2cb1c90bdea4833e142eb444efddb4aabc3cbd2f # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@2cb1c90bdea4833e142eb444efddb4aabc3cbd2f # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@2cb1c90bdea4833e142eb444efddb4aabc3cbd2f # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@2cb1c90bdea4833e142eb444efddb4aabc3cbd2f # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@2cb1c90bdea4833e142eb444efddb4aabc3cbd2f # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@2cb1c90bdea4833e142eb444efddb4aabc3cbd2f # master
    with:
      scandir: ./.scripts
      severity: warning
