---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@4d676227c7f9080e29575e1672d90bd5a8464aca # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@4d676227c7f9080e29575e1672d90bd5a8464aca # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@4d676227c7f9080e29575e1672d90bd5a8464aca # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@4d676227c7f9080e29575e1672d90bd5a8464aca # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@4d676227c7f9080e29575e1672d90bd5a8464aca # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@4d676227c7f9080e29575e1672d90bd5a8464aca # master
    with:
      scandir: ./.scripts
      severity: warning
