---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0
    with:
      scandir: ./.scripts
      severity: warning
