---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@de3c480e54564ef39fd13d1f097d48a62bef5f30 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@de3c480e54564ef39fd13d1f097d48a62bef5f30 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@de3c480e54564ef39fd13d1f097d48a62bef5f30 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@de3c480e54564ef39fd13d1f097d48a62bef5f30 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@de3c480e54564ef39fd13d1f097d48a62bef5f30 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@de3c480e54564ef39fd13d1f097d48a62bef5f30 # master
    with:
      scandir: ./.scripts
      severity: warning
