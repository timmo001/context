---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@25a66b4ab492fd099bd152e0f33f7a51b4a6955f # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@25a66b4ab492fd099bd152e0f33f7a51b4a6955f # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@25a66b4ab492fd099bd152e0f33f7a51b4a6955f # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@25a66b4ab492fd099bd152e0f33f7a51b4a6955f # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@25a66b4ab492fd099bd152e0f33f7a51b4a6955f # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@25a66b4ab492fd099bd152e0f33f7a51b4a6955f # master
    with:
      scandir: ./.scripts
      severity: warning
