---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@d8a1fbde67c3e0e02eb592454be2e7b78ac9deb7 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@d8a1fbde67c3e0e02eb592454be2e7b78ac9deb7 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@d8a1fbde67c3e0e02eb592454be2e7b78ac9deb7 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@d8a1fbde67c3e0e02eb592454be2e7b78ac9deb7 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@d8a1fbde67c3e0e02eb592454be2e7b78ac9deb7 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@d8a1fbde67c3e0e02eb592454be2e7b78ac9deb7 # master
    with:
      scandir: ./.scripts
      severity: warning
