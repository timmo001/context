---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@ee51b59fac85756d78f89c26f2c5db58ecd5d36a # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@ee51b59fac85756d78f89c26f2c5db58ecd5d36a # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@ee51b59fac85756d78f89c26f2c5db58ecd5d36a # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@ee51b59fac85756d78f89c26f2c5db58ecd5d36a # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@ee51b59fac85756d78f89c26f2c5db58ecd5d36a # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@ee51b59fac85756d78f89c26f2c5db58ecd5d36a # master
    with:
      scandir: ./.scripts
      severity: warning
