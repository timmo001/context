---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@e3b23050c36f377820199079cb2e2bb2c4ce6863 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@e3b23050c36f377820199079cb2e2bb2c4ce6863 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@e3b23050c36f377820199079cb2e2bb2c4ce6863 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@e3b23050c36f377820199079cb2e2bb2c4ce6863 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@e3b23050c36f377820199079cb2e2bb2c4ce6863 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@e3b23050c36f377820199079cb2e2bb2c4ce6863 # master
    with:
      scandir: ./.scripts
      severity: warning
