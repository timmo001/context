    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0

  markdown-links:
