---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master
    with:
      scandir: ./.scripts
      severity: warning
