---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@cef23eb35e34cbf700318426c754e8d77a6167e1 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@cef23eb35e34cbf700318426c754e8d77a6167e1 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@cef23eb35e34cbf700318426c754e8d77a6167e1 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@cef23eb35e34cbf700318426c754e8d77a6167e1 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@cef23eb35e34cbf700318426c754e8d77a6167e1 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@cef23eb35e34cbf700318426c754e8d77a6167e1 # master
    with:
      scandir: ./.scripts
      severity: warning
