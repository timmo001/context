---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@99962e317ddd188020e30f9231637dd6e4479d1d # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@99962e317ddd188020e30f9231637dd6e4479d1d # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@99962e317ddd188020e30f9231637dd6e4479d1d # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@99962e317ddd188020e30f9231637dd6e4479d1d # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@99962e317ddd188020e30f9231637dd6e4479d1d # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@99962e317ddd188020e30f9231637dd6e4479d1d # master
    with:
      scandir: ./.scripts
      severity: warning
