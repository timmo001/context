---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@68adb4ba625cbc742312fe526d57024f1ec4b493 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@68adb4ba625cbc742312fe526d57024f1ec4b493 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@68adb4ba625cbc742312fe526d57024f1ec4b493 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@68adb4ba625cbc742312fe526d57024f1ec4b493 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@68adb4ba625cbc742312fe526d57024f1ec4b493 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@68adb4ba625cbc742312fe526d57024f1ec4b493 # master
    with:
      scandir: ./.scripts
      severity: warning
