---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@76f563af4f42ee9be7afe567514c4e376b3b56c6 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@76f563af4f42ee9be7afe567514c4e376b3b56c6 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@76f563af4f42ee9be7afe567514c4e376b3b56c6 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@76f563af4f42ee9be7afe567514c4e376b3b56c6 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@76f563af4f42ee9be7afe567514c4e376b3b56c6 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@76f563af4f42ee9be7afe567514c4e376b3b56c6 # master
    with:
      scandir: ./.scripts
      severity: warning
