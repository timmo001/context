---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0
    with:
      scandir: ./.scripts
      severity: warning
