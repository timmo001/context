---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@414d822006b46f7d5f2b4d2b6fda12807994c212 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@414d822006b46f7d5f2b4d2b6fda12807994c212 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@414d822006b46f7d5f2b4d2b6fda12807994c212 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@414d822006b46f7d5f2b4d2b6fda12807994c212 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@414d822006b46f7d5f2b4d2b6fda12807994c212 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@414d822006b46f7d5f2b4d2b6fda12807994c212 # master
    with:
      scandir: ./.scripts
      severity: warning
