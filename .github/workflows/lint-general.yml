---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@2b050288cd02492c371a6ef5269817db163c002b # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@2b050288cd02492c371a6ef5269817db163c002b # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@2b050288cd02492c371a6ef5269817db163c002b # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@2b050288cd02492c371a6ef5269817db163c002b # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@2b050288cd02492c371a6ef5269817db163c002b # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@2b050288cd02492c371a6ef5269817db163c002b # master
    with:
      scandir: ./.scripts
      severity: warning
