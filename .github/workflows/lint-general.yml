  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2

