    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@f72d1eb6c310502499f5551d65ceca1e478eb266 # 20261003.0

