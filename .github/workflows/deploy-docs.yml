---
# Deploys the prod stage of the docs site's Alchemy stack in docs/alchemy.run.ts
# from main: the context-docs Worker at context.timmo.dev. The Cloudflare token
# comes from docs/stacks/github.ts.
name: Deploy docs

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-docs.yml
      - docs/**
      - mise.toml
  workflow_dispatch: {}

# Deploys queue rather than cancel, so a stack update never stops halfway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: timmo001/workflows/.github/workflows/deploy-alchemy.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0
    with:
      task: docs:deploy
      smoke-check: |
        https://context.timmo.dev/ 200
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
