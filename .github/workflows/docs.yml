---
name: Docs

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/cli/spec.ts"
      - "src/mcp/toolMetadata.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/cli/spec.ts"
      - "src/mcp/toolMetadata.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/check-docs.yml@36ba6651f1296cce685ede8ac38b9574c9291028 # master
    with:
      generated-paths: |
        docs/src/content/docs/cli/commands.md
        docs/src/content/docs/mcp/tools.md
