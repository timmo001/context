---
name: Lint package configs

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - ".scripts/**/*PKGBUILD*"
      - ".github/workflows/lint-package-config.yml"
  pull_request:
    paths:
      - ".scripts/**/*PKGBUILD*"
      - ".github/workflows/lint-package-config.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pkgbuild:
    uses: timmo001/workflows/.github/workflows/lint-arch-pkgbuild.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0
    with:
      exclude-rules: redundant_makedepends
