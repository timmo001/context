---
name: Lint package configs

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - ".scripts/**/*PKGBUILD*"
      - ".github/workflows/lint-package-config.yml"
  pull_request:
    paths:
      - ".scripts/**/*PKGBUILD*"
      - ".github/workflows/lint-package-config.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pkgbuild:
    uses: timmo001/workflows/.github/workflows/lint-arch-pkgbuild.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3
    with:
      exclude-rules: redundant_makedepends
