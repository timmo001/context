---
name: Lint package configs

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - ".scripts/**/*PKGBUILD*"
      - ".github/workflows/lint-package-config.yml"
  pull_request:
    paths:
      - ".scripts/**/*PKGBUILD*"
      - ".github/workflows/lint-package-config.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pkgbuild:
    uses: timmo001/workflows/.github/workflows/lint-arch-pkgbuild.yml@6e3616d0d48c9c8ed9865b648107140b99b16551 # 20261024.0
    with:
      exclude-rules: redundant_makedepends
