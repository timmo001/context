---
name: Lint package configs

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - ".scripts/**/*PKGBUILD*"
      - ".github/workflows/lint-package-config.yml"
  pull_request:
    paths:
      - ".scripts/**/*PKGBUILD*"
      - ".github/workflows/lint-package-config.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pkgbuild:
    uses: timmo001/workflows/.github/workflows/lint-arch-pkgbuild.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
    with:
      exclude-rules: redundant_makedepends
