---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0
    with:
      smoke-test: |-
        ./dist/context help
        ./dist/context stack --json
