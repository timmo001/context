---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      smoke-test: |-
        ./dist/context help
        ./dist/context stack --json
