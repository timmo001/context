---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0
    with:
      smoke-test: |-
        ./dist/context help
        ./dist/context stack --json
