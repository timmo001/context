---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
    with:
      smoke-test: |-
        ./dist/context help
        ./dist/context stack --json
