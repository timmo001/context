---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0
    with:
      smoke-test: |-
        ./dist/context help
        ./dist/context stack --json
