---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2
    with:
      smoke-test: |-
        ./dist/context help
        ./dist/context stack --json
