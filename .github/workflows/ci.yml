---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@6e3616d0d48c9c8ed9865b648107140b99b16551 # 20261024.0
    with:
      smoke-test: |-
        ./dist/context help
        ./dist/context stack --json
