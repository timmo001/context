---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0
    with:
      smoke-test: |-
        ./dist/context help
        ./dist/context stack --json
