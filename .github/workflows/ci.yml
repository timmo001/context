---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@dee521f49caa2626c8adeed2af4767887b2f202b # 20261009.1
    with:
      smoke-test: |-
        ./dist/context help
        ./dist/context stack --json
